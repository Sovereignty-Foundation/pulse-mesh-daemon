# SPDX-License-Identifier: LicenseRef-Proprietary
# Pulse Mesh Daemon: a runner on the standard. The mesh-hub daemon with its
# port protocol for JSON clients, the hub runtime, the Rust client, the dev
# ring, and the tools (`pms`, `pms-mcp`, the telemetry exporter); the thin
# clients (clients/) and the basket query tool (tools/pms-query) beside them.
# The standard is a sibling checkout, ../pulse-mesh, while developing, and a
# pinned tag at a release.
#
# Layout:
#   mesh/      Tier 2: the fabric (daemon, port protocol, hub runtime, client,
#              broadcast, health, basket, module hub)
#   dev_ring/  Tier 3: the dev ring (dev-core, dev-functions, dev-stages,
#              dev-hub), the four-crate shape
#   tools/     `pms`, `pms-mcp`, `pms-telemetry-export`
#   examples/  the two-process example and the multi-language one

[workspace]
resolver = "2"
members = [
    "dev_ring/dev-core",
    "dev_ring/dev-functions",
    "dev_ring/dev-hub",
    "dev_ring/dev-stages",
    "examples/multi-process",
    "mesh/mesh-basket",
    "mesh/mesh-broadcast",
    "mesh/mesh-client",
    "mesh/mesh-health",
    "mesh/mesh-hub",
    "mesh/mesh-hub-runtime",
    "mesh/mesh-link",
    "mesh/mesh-module-hub",
    "mesh/mesh-port-protocol",
    "mesh/mesh-schema",
    "tools/pms",
    "tools/pms-mcp",
    "tools/pms-telemetry-export",
]

[workspace.package]
version = "1.0.0-beta"
edition = "2021"
authors = ["Sovereignty Foundation Inc."]
license-file = "LICENSE"
rust-version = "1.95"
# Pre-release gate — every crate that inherits this field via
# `publish.workspace = true` is locked out of `cargo publish`. Flip
# individual crates back to `publish = true` only when an explicit
# release decision has been made for that crate.
publish = false

[workspace.dependencies]
# ── Standard utility crates ─────────────────────────────────────────
anyhow = "1.0"
async-trait = "0.1"
bitflags = "2"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
crc32c = "0.6"
futures-util = "0.3"
hex = "0.4"
io-uring = "0.6"
libc = "0.2"
parking_lot = "0.12"
quanta = "0.12"
raw-cpuid = "11"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.5"
thiserror = "1.0"
tokio = "1.37"
tokio-tungstenite = "0.21"
toml = "0.8"
tracing = "0.1"

# ── Sealed UDP (ADR-0018), in pulse-wire-udp ───────────────────────
# Vetted implementations only (ADR-0018 item 9): snow runs the Noise
# handshake, and its raw split hands the transport keys to the same
# chacha20poly1305 crate snow's own cipher uses, which seals each datagram
# with its header as associated data. getrandom picks session indices;
# zeroize wipes key material.
chacha20poly1305 = "0.10.1"
getrandom = "0.2"
snow = { version = "0.9.6", features = ["risky-raw-split"] }
zeroize = "1.8"

# ── OpenTelemetry, for mesh-hub's opt-in `otel` feature ─────────────
# Defaults off: each crate names the features it uses, so that only the
# traces signal and the OTLP/HTTP transport are built.
opentelemetry = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false }
opentelemetry_sdk = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }

# ── TLS 1.3 (ADR-0018 item 6) ───────────────────────────────────────
# rustls on its `ring` provider. rustls's default provider, aws-lc-rs, is
# built with cmake and a C toolchain; `ring` needs only a C compiler. Only
# TLS 1.3 is built (no `tls12` feature). The enterprise ring's TLS stage
# and the daemon's `wss://` WebSocket serve with it, and `mesh-client`
# connects with it, trusting webpki-roots' copy of the Mozilla root
# program's roots by default. 0.23.46 is the floor: it fixes
# RUSTSEC-2026-0346 to -0349, which 0.23.45 and earlier carry.
# webpki-roots 1.0.10 is its floor: it drops the emSign root that
# RUSTSEC-2026-0381 names, and the lock files hold rustls-webpki at
# 0.103.16, which fixes RUSTSEC-2026-0382.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
webpki-roots = "1.0.10"

# ── Key-proof attach (ADR-0018 item 6, L2-8) ────────────────────────
# A client attaching with a key signs the daemon's challenge with
# Ed25519, which ed25519-dalek implements; the daemon verifies with
# `verify_strict`. 2.2.0 (2025-07) rather than 3.0.0 (2026-07): the 2.x
# line is the one in wide use, on curve25519-dalek 4.1.3, past
# RUSTSEC-2024-0344, and its SHA-512 is the sha2 0.10 tungstenite's sha1
# already brings; 3.0 is a new major on new majors of both. Default
# features: `fast`, `std`, and `zeroize`, which clears a secret key as it
# drops. Nonces and new keys come from the operating system through
# getrandom, and key files are read into buffers zeroize clears; both are
# pinned once, with sealed UDP's entries above.
ed25519-dalek = "2.2.0"

# ── Dev/test deps shared across the workspace ──────────────────────
assert_cmd = "2.0"
proptest = "1.4"
tempfile = "3.10"
# Test certificates for the TLS tests, signed with `ring` (rcgen's default
# provider is aws-lc-rs, as above).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# ── Centralized lint enforcement (Cargo 1.74+) ──────────────────────
# Each crate inherits via `[lints]\nworkspace = true` in its Cargo.toml.

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"
# cargo-fuzz builds every crate with `--cfg fuzzing`; core-store and
# core-ring compile their readers' interleaving points for the fuzz harness
# only under it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_safety_doc = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
multiple_crate_versions = "allow"
