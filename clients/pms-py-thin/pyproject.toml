[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pms-py-thin"
version = "1.0.0b0"
description = "Pulse Mesh thin Python client — Universal Port Protocol v0 over WebSocket."
requires-python = ">=3.9"
license = { text = "LicenseRef-Proprietary" }
classifiers = [
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
authors = [{ name = "Sovereignty Foundation Inc." }]
dependencies = [
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pms*"]
