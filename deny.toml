# cargo-deny configuration for pulse-mesh.
#
# Scope: supply-chain hygiene only: advisories, bans and sources. The
# `[licenses]` section is not configured in this file.
#
# Run locally: `cargo deny --all-features check advisories bans sources`.
# Install: `cargo install cargo-deny`.
#
# Reference: https://embarkstudios.github.io/cargo-deny/

# ─────────────────────────── advisories ───────────────────────────
# RustSec advisory database. A known vulnerability fails the check and a
# yanked version is a warning. Advisories that a crate is unmaintained are
# not checked at all (`unmaintained = "none"`): cargo-deny has no warning
# level for them, only the scope in which they fail, and a stale upstream
# should not fail the build before a maintainer decides to act on it.
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "none"
yanked = "warn"
# When a vulnerability is acknowledged but cannot be patched
# immediately, list its RUSTSEC-YYYY-NNNN id here with a comment
# explaining the call. Keep this list small and reviewed at each
# release cut.
ignore = []

# ─────────────────────────── bans ───────────────────────────
# Catch accidental dependencies on crates we have explicitly chosen
# not to use, and dedupe multiple versions of the same crate.
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # workspace path deps (path = "...") have no version by design
highlight = "all"
# Crates we never want as dependencies (transitively or otherwise).
# Keep the list short and explain each entry; an empty list is fine
# until a real "we don't want this" decision lands.
deny = []
# Crates allowed to appear multiple times in the dep graph (typically
# because a popular crate is mid-major-version-bump and the ecosystem
# hasn't caught up yet). Each entry names the one version that a single
# dependency path still pulls in beside the version the rest of the graph
# uses, and why. An entry that no longer matches, or no longer removes a
# duplicate, is itself reported, so it goes when its reason does.
skip = [
    { crate = "bitflags@1.3.2", reason = "io-uring 0.6, which the io_uring transport in robotics-stages uses, depends on bitflags 1; everything else is on 2" },
    { crate = "cpufeatures@0.2.17", reason = "sha1 0.10, which tungstenite 0.21 uses for the WebSocket handshake, depends on cpufeatures 0.2; blake3 is on 0.3" },
    { crate = "hashbrown@0.17.1", reason = "indexmap 2, under toml 0.8 in mesh-context, is on hashbrown 0.17; dashmap 6 and hashlink 0.9 (rusqlite) are on 0.14" },
    { crate = "socket2@0.5.10", reason = "pulse-wire-udp is written against socket2 0.5; tokio 1.52 has moved to 0.6" },
    { crate = "thiserror@2.0.18", reason = "prometheus 0.14, in pms-telemetry-export, is on thiserror 2; the workspace's error types derive with thiserror 1" },
    { crate = "thiserror-impl@2.0.18", reason = "the derive macro of thiserror 2, for prometheus 0.14 as above" },
    { crate = "windows-sys@0.52.0", reason = "socket2 0.5's Windows bindings; the tree runs on Linux and macOS, so they are never built" },
]
skip-tree = []

# ─────────────────────────── sources ───────────────────────────
# Only allow dependencies from the public crates.io registry and
# vetted git repositories. Catches mistakes like an accidental git
# dep on a private fork.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources we approve of (e.g. pre-release dependencies that
# don't have a crates.io publish yet). Keep this list narrow.
allow-git = []

# Per-org git allow rules. Keep empty unless we deliberately consume
# a specific org's repos.
[sources.allow-org]
github = []
gitlab = []
bitbucket = []
